<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420" width="1500" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1035"/>
      <stop offset="0.55" stop-color="#3A1C71"/>
      <stop offset="1" stop-color="#7B2D6E"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.25" r="0.45">
      <stop offset="0" stop-color="#FF6F91" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6F91" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.9" r="0.4">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFD1E8"/>
    </linearGradient>
    <style>
      .node { animation: pulse 3s ease-in-out infinite; }
      .n2 { animation-delay: .6s } .n3 { animation-delay: 1.2s } .n4 { animation-delay: 1.8s } .n5 { animation-delay: 2.4s }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .flow { stroke-dasharray: 6 10; animation: dash 6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -160 } }
    </style>
  </defs>

  <rect width="1500" height="420" fill="url(#bg)"/>
  <rect width="1500" height="420" fill="url(#glow1)"/>
  <rect width="1500" height="420" fill="url(#glow2)"/>

  <!-- stars -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="90" cy="60" r="1.6"/><circle cx="240" cy="120" r="1.2"/><circle cx="410" cy="40" r="1.8"/>
    <circle cx="620" cy="90" r="1.1"/><circle cx="760" cy="30" r="1.5"/><circle cx="880" cy="380" r="1.3"/>
    <circle cx="530" cy="370" r="1.6"/><circle cx="1010" cy="60" r="1.2"/><circle cx="1440" cy="380" r="1.7"/>
    <circle cx="330" cy="390" r="1.1"/><circle cx="1180" cy="395" r="1.4"/><circle cx="60" cy="300" r="1.2"/>
  </g>

  <!-- agent network graphic (right side) -->
  <g stroke="#C9B8FF" stroke-width="1.6" fill="none" opacity="0.75">
    <path class="flow" d="M1120 120 L1260 90 L1380 170 L1290 290 L1150 260 Z"/>
    <path class="flow" d="M1120 120 L1290 290 M1260 90 L1150 260 M1380 170 L1150 260"/>
  </g>
  <g>
    <circle class="node"    cx="1120" cy="120" r="11" fill="#FF6F91"/>
    <circle class="node n2" cx="1260" cy="90"  r="9"  fill="#FFD166"/>
    <circle class="node n3" cx="1380" cy="170" r="12" fill="#6C63FF"/>
    <circle class="node n4" cx="1290" cy="290" r="10" fill="#4ECDC4"/>
    <circle class="node n5" cx="1150" cy="260" r="9"  fill="#FF9ECD"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#EDE7FF" opacity="0.9">
    <text x="1092" y="100">Reason</text>
    <text x="1240" y="70">Act</text>
    <text x="1400" y="175">Ask</text>
    <text x="1308" y="318">Check</text>
    <text x="1080" y="290">Decide</text>
  </g>

  <!-- text block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="90" y="150" font-size="22" fill="#FFB3D1" letter-spacing="4">HELLO, I'M</text>
    <text x="90" y="215" font-size="62" font-weight="700" fill="url(#txt)">Rimjhim (Rémy) Singh</text>
    <text x="92" y="262" font-size="23" fill="#E6DCFF">Applied AI Researcher · AI Engineer · Agentic AI Architect · Founder of Rikanverse</text>
    <rect x="92" y="292" width="466" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="114" y="321" font-size="19" fill="#FFFFFF">Building AI that knows when to ask, act or decline</text>
  </g>
</svg>
